[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent-insight"
version = "0.1.0"
description = "Traceable financial research agent with hybrid RAG, safe analytics, and bad-case evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "httpx>=0.27,<1.0",
  "langgraph>=0.2,<2.0",
  "python-multipart>=0.0.12,<1.0",
  "pypdf>=5.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.7,<1.0",
]

[project.scripts]
finagent-eval = "app.evaluation.runner:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
