[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-insight-agent"
version = "0.2.0"
description = "Traceable financial research agent with hybrid RAG, safe analytics, and bad-case evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "httpx>=0.27,<1.0",
  "matplotlib>=3.8",
  "Pillow>=10",
  "langgraph>=1.0,<2.0",
  "redis>=5",
  "mcp>=1,<2",
  "sqlite-vec>=0.1.9",
  "pymysql>=1.1",
  "python-multipart>=0.0.12,<1.0",
  "pypdf>=5.0,<7.0",
]

[project.optional-dependencies]
production-rag = [
  "chromadb>=0.5,<2.0",
  "jieba>=0.42,<1.0",
  "pdfplumber>=0.11,<1.0",
]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.7,<1.0",
  "PyYAML>=6",
]

[project.scripts]
finance-insight = "finance_insight.cli:main"
finagent-eval = "finance_insight.legacy.evaluation.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finance_insight = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
