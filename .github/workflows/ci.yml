name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,production-rag]"
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Bootstrap synthetic demo
        run: python scripts/init_demo_data.py --data-dir .demo-data
      - name: Verify optional Chroma path
        run: python scripts/index_demo_chroma.py
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Run full test suite
        run: python -m pytest -q
      - name: Run public demo evaluation
        env:
          DEMO_MODE: "true"
          FINANCE_DB: .demo-data/finance_insight.sqlite3
          RAG_DB: .demo-data/rag.sqlite3
          ARTIFACT_DIR: .demo-data/artifacts
          LOG_DIR: .demo-data/logs
          EVAL_DATASET: evals/dataset_demo.json
          EVAL_OUTPUT: .demo-data/evaluation/report.json
        run: python -m finance_insight.evaluation --dataset evals/dataset_demo.json --output .demo-data/evaluation/report.json
      - name: Upload public demo evaluation
        uses: actions/upload-artifact@v4
        with:
          name: public-demo-evaluation
          path: .demo-data/evaluation/report.json
          if-no-files-found: error
