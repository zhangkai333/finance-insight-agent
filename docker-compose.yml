services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-2}
      REQUEST_QUEUE_TIMEOUT_SECONDS: ${REQUEST_QUEUE_TIMEOUT_SECONDS:-15}
      REDIS_URL: redis://redis:6379/0
      FINANCE_BACKEND: mysql
      MYSQL_FALLBACK_TO_SQLITE: "true"
      MYSQL_POOL_SIZE: ${MYSQL_POOL_SIZE:-4}
      MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS: ${MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS:-5}
      MYSQL_SYNC_FROM_SQLITE: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-finance_insight}
      MYSQL_USER: ${MYSQL_USER:-finance}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 6
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-finance_insight}
      MYSQL_USER: ${MYSQL_USER:-finance}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 15
volumes:
  redis_data:
  mysql_data:
