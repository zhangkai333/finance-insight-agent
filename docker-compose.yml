services:
  finagent:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_PATH: ${DATABASE_PATH:-data/finagent.db}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_CIRCUIT_FAILURE_THRESHOLD: ${LLM_CIRCUIT_FAILURE_THRESHOLD:-3}
      LLM_CIRCUIT_RESET_SECONDS: ${LLM_CIRCUIT_RESET_SECONDS:-60}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      MAX_AGENT_RETRIES: ${MAX_AGENT_RETRIES:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - finagent_data:/app/data
    restart: unless-stopped

volumes:
  finagent_data:
